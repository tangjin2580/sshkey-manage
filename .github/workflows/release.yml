name: Build and Release Electron App

# 解决 403：默认 GITHUB_TOKEN 只读，创建 release 需要 contents: write
permissions:
  contents: write

# 同一分支重复 push 时取消旧 run（节省 CI 资源）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
      - cross-platform-app
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # === 第一阶段：每个平台单独跑一份 build ===
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      # 单平台失败不影响其他平台继续（debug 友好）
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 项目用 bun 维护依赖（仓库有 bun.lock，无 package-lock.json）。
      # 用 bun 装包能复用本地锁文件，不会和本地开发环境 drift。
      # bun 生成的 node_modules/ 与 npm 兼容，下游 vite/esbuild/electron-builder 无需改动。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Application
        run: bun run build

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: bunx electron-builder -w
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: bunx electron-builder -m
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        run: bunx electron-builder -l
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 调试用：打包完后看 release/ 实际产出了什么（CI 日志直接可见）
      # 必须 shell: bash —— windows-latest 默认是 PowerShell，不认 2>/dev/null，
      # 会把 /dev/null 当字面路径解析，找不到就报错
      - name: List release artifacts
        if: always()
        shell: bash
        run: |
          echo "=== release/ contents ==="
          if [ -d release ]; then ls -lhR release/; else echo "(release/ not found)"; fi

      # 把本平台的产物上传为 artifact，等 release job 拉取
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.tar.gz

  # === 第二阶段：等三平台都跑完，合并 artifact 建一个 release ===
  release:
    name: Publish GitHub Release
    needs: build
    # 只在打 tag 推送时才建 release（v1.0.0、v1.2.3-rc1 等）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 把三平台的 artifact 全部下到同一个 runner 上
      # 不指定 name → 下载所有 artifact；每个落到 artifacts/<artifact-name>/ 子目录
      # 最终结构：artifacts/app-release-<os>/*.exe|.dmg|.AppImage|.deb
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== artifacts/ contents ==="
          ls -lhR artifacts/ 2>/dev/null || echo "(no artifacts downloaded)"

      # 按实际 tag 名建 release，三平台产物一次性塞进去
      # tag_name 不写死 —— 默认就是 ${{ github.ref_name }}（去掉 refs/tags/ 前缀）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          # 即使部分平台产物缺失也不阻塞 release 步骤
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}